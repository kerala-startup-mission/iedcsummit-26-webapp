<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#097ED8" />
    <title>IEDC Summit 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Space+Grotesk:wght@500..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Runtime configuration, read before the app module runs. Served from public/ as an
      empty object; the Docker image rewrites it at container start so one image can be
      pointed at a different event without rebuilding. %BASE_URL% keeps it resolvable
      when the app is deployed under a subpath.
    -->
    <script src="%BASE_URL%config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
