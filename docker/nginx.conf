server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    # Filenames are content-hashed, so these can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # index.html names the current asset hashes, so caching it serves a stale app.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Rewritten on every container start, so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # A stale service worker would pin visitors to an old precache manifest.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-store";
    }

    # History-mode router: deep links like /speakers/46x6Y are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
